<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap"></noscript>
<!-- เปิดการเชื่อมต่อกับระบบหลังบ้าน (Google Apps Script) ไว้ล่วงหน้า -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
:root{
  /* Design specs: อยู่ดีมีแต้ม (ผสมโทนจากต้นแบบ Canva) */
  --forest:#1F6B4F;      /* เขียวป่า จากต้นแบบ Canva — ปุ่มหลัก/หัวข้อ */
  --forest-2:#17553F;
  --emerald:#1B9C85;     /* Eco Emerald — ใช้ตกแต่งหรือตัวใหญ่ 24px ขึ้นไปเท่านั้น */
  --emerald-text:#127A68;/* มรกตปรับเข้ม สำหรับตัวหนังสือขนาดปกติ (5.24:1 บนขาว) */
  --blue:#00A8CC;        /* Taling Blue (ฟ้าคูคลอง) — ภาพประกอบ ไอคอนใหญ่ */
  --blue-dark:#006B8A;   /* ฟ้าปรับเข้ม สำหรับปุ่มตัวขาว (6.05:1) */
  --amber:#FFB000;       /* Reward Amber (เหลืองแต้ม) */
  --amber-soft:#FFF4D6;
  --ink:#212529;         /* Dark Slate (ตัวอักษร) */
  --muted:#56655D;
  --bg:#F8F9FA;          /* Light Background */
  --mint:#E7F3EC;
  --mint-2:#D6EBDF;
  --cream:#F7F3E2;
  --line:#DCE8E1;
  --card:#FFFFFF;
  --danger:#B4400E;
  --danger-soft:#FDECE4;
  --deep:#13463A;        /* เขียวเข้มที่สุด สำหรับหัวข้อใหญ่หน้าแรก (10.69:1 บนขาว) */
  --band:#FAF8EF;        /* พื้นครีมอ่อนของแถบของรางวัล */
  --pts-text:#9A6200;    /* ตัวเลขแต้มบนพื้นขาว (5.10:1) ห้ามใช้เหลือง #FFB000 เป็นตัวหนังสือบนขาว */
  --radius:20px;
  --shadow:0 1px 2px rgba(23,85,63,.05),0 10px 28px -12px rgba(23,85,63,.18);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:'Sarabun',system-ui,sans-serif;font-size:17px;line-height:1.65;color:var(--ink);
  background:#EEF4E8 linear-gradient(110deg,#E2F2E4 0%,#ECF4E5 45%,#F6F4E1 100%);
  min-height:100vh;display:flex;flex-direction:column;
}
h1,h2,h3,h4,.kanit,.btn,.brand-name,.chip,.tab{font-family:'Kanit',system-ui,sans-serif}
h1,h2,h3{color:var(--forest-2);line-height:1.3;margin:0 0 .4em}
h2{font-size:1.35rem}
h3{font-size:1.12rem}
a{color:var(--forest)}
img{max-width:100%;display:block}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 16px}

/* ---------- Top bar ---------- */
.topbar{background:#fff;border-bottom:1px solid rgba(23,85,63,.08);position:sticky;top:0;z-index:30}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:72px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;flex:1;min-width:0}
.brand-logo{width:46px;height:46px;border-radius:14px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--forest)}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-text{min-width:0;display:flex;flex-direction:column}
.brand-name{font-weight:700;font-size:1.3rem;color:var(--forest-2);line-height:1.15;white-space:nowrap}
.brand-sub{font-size:.875rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlinks{display:none;gap:8px}
.navlinks a{font-family:'Kanit';font-weight:500;text-decoration:none;color:var(--forest-2);padding:9px 16px;border-radius:12px;background:var(--mint);font-size:.95rem;white-space:nowrap;transition:background .15s}
.navlinks a:hover{background:var(--mint-2)}
.navlinks a.active{background:var(--forest);color:#fff}
.menu-btn{width:48px;height:48px;border-radius:14px;border:0;background:var(--mint);color:var(--forest-2);display:grid;place-items:center;cursor:pointer}
.staff-chip{display:none;font-family:'Kanit';font-size:.875rem;background:var(--amber-soft);color:#7A4B00;padding:6px 10px;border-radius:999px;white-space:nowrap}
.staff-chip.on{display:inline-flex;align-items:center;gap:4px}
@media (max-width:420px){.staff-chip.on{display:none}}
@media (min-width:1040px){.navlinks{display:flex}.menu-btn{display:none}}

/* ---------- Drawer ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(15,40,30,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(86vw,340px);background:#fff;z-index:41;transform:translateX(100%);transition:transform .25s;padding:18px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto}
body.menu-open .drawer-bg{opacity:1;pointer-events:auto}
body.menu-open .drawer{transform:none}
.drawer a{display:flex;align-items:center;gap:12px;font-family:'Kanit';font-size:1.05rem;text-decoration:none;color:var(--forest-2);padding:13px 14px;border-radius:14px}
.drawer a.active{background:var(--mint)}
.drawer .sep{height:1px;background:var(--line);margin:8px 0}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

/* ---------- Demo bar ---------- */
.demo{padding-top:18px;color:#6B4A00;font-size:.9rem}
.demo-box{background:#FFFDF3;border:1px solid #F2E2AE;border-radius:16px;padding:12px 16px}

/* ---------- Layout ---------- */
main{flex:1;padding:24px 0 48px}
section{margin-bottom:24px}
.card{background:var(--card);border:1px solid rgba(23,85,63,.07);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.grid3{display:grid;gap:14px;grid-template-columns:1fr}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.grid3{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.grid3{grid-template-columns:repeat(3,1fr)}}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{margin:0}
.eyebrow{font-family:'Kanit';font-weight:500;font-size:.9rem;color:var(--emerald-text);margin:0 0 2px}
.sec-link{font-family:'Kanit';font-weight:500;color:var(--emerald-text);text-underline-offset:4px;white-space:nowrap}
/* แถบพื้นครีมเต็มความกว้างจอ (ไม่ทำให้หน้าเลื่อนด้านข้าง) */
.band{background:var(--band);box-shadow:0 0 0 100vmax var(--band);-webkit-clip-path:inset(0 -100vmax);clip-path:inset(0 -100vmax);padding:30px 0 34px;margin:34px 0 0}
#app > .band:last-child{margin-bottom:-48px;padding-bottom:52px}
main{display:flex;flex-direction:column}
#app{flex:1 0 auto}
#app:has(> .band:last-child){display:flex;flex-direction:column}
#app > .band:last-child{flex:1 0 auto}

/* ---------- Hero: ข้อความซ้าย รูปขวา (จอเล็กเรียงบนลงล่าง) ---------- */
.hero{display:grid;gap:24px;align-items:center;margin-bottom:0;background:linear-gradient(115deg,#F3F9F3 0%,#EDF5E9 55%,#F8F6E7 100%);border:1px solid rgba(23,85,63,.07);border-radius:28px;padding:24px 18px;box-shadow:0 1px 2px rgba(23,85,63,.05),0 22px 44px -22px rgba(23,85,63,.30)}
.hero-pill{display:inline-flex;align-items:center;gap:6px;background:var(--mint);color:var(--emerald-text);border-radius:999px;padding:6px 14px;font-family:'Kanit';font-weight:500;font-size:.9rem}
.hero h1{font-size:clamp(2.1rem,7vw,2.8rem);font-weight:700;color:var(--deep);line-height:1.3;margin:14px 0 10px}
.hero-desc{max-width:42ch;color:var(--muted);margin:0;font-size:1.08rem}
.hero-actions{display:grid;gap:12px;margin-top:22px}
.hero-actions .btn{min-height:58px;border-radius:16px;font-size:1.05rem}
.hero-media{border-radius:20px;overflow:hidden;aspect-ratio:16/10;background:#DDEFE3}
.hero-media > img,.hero-media > svg{width:100%;height:100%;object-fit:cover;display:block}
@media (min-width:600px){.hero{padding:32px 30px}.hero-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.hero-actions .btn{padding:10px 12px}}
@media (min-width:960px){
  .hero{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:44px;padding:46px 48px}
  .hero-actions{display:flex;flex-wrap:wrap;gap:10px}
  .hero-actions .btn{flex:1 1 auto;min-height:54px;padding:10px 15px;font-size:1rem}
  .hero-media{aspect-ratio:5/4}
}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;border:0;font-size:1rem;font-weight:500;text-decoration:none;cursor:pointer;transition:transform .05s,filter .15s;text-align:center;line-height:1.3}
.btn:active{transform:translateY(1px)}
.btn:disabled,.btn.is-busy{opacity:.55;cursor:not-allowed}
.btn.is-busy{pointer-events:none}
.btn-primary{background:var(--forest);color:#fff}
.btn-primary:hover{filter:brightness(1.08)}
.btn-amber{background:var(--amber);color:#3D2A00}
.btn-blue{background:var(--blue-dark);color:#fff}
.btn-soft{background:var(--mint);color:var(--forest-2)}
.btn-ghost{background:transparent;color:var(--forest-2);border:1.5px solid var(--line)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-lg{min-height:60px;font-size:1.08rem;border-radius:18px;padding:12px 22px}
.btn-block{width:100%}
.btn-sm{min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:11px}

/* ---------- Rewards: การ์ดขาว รูปอยู่ในกรอบมุมมน ---------- */
.reward{display:flex;flex-direction:column;background:#fff;border:1px solid rgba(23,85,63,.06);border-radius:22px;padding:10px;box-shadow:var(--shadow)}
.reward-img{aspect-ratio:16/9;display:grid;place-items:center;position:relative}
.reward > .reward-img{border-radius:15px;overflow:hidden}
.reward-img img{width:100%;height:100%;object-fit:cover}
.reward-body{padding:12px 8px 6px;display:flex;flex-direction:column;gap:5px;flex:1}
.reward-name{font-family:'Kanit';font-weight:600;font-size:1.12rem;color:var(--ink);line-height:1.3}
.reward-desc{color:var(--muted);font-size:.95rem;flex:1}
.reward-pts{font-family:'Kanit';font-weight:500;color:var(--pts-text);font-size:1rem;margin-top:2px}
.reward-pts b{font-weight:600;font-size:1.15rem}
.reward .btn{min-height:50px;margin-top:10px}
.pts{display:inline-flex;align-items:baseline;gap:4px;background:var(--amber-soft);color:#7A4B00;border-radius:999px;padding:4px 12px;font-family:'Kanit';font-weight:600;align-self:flex-start}
.pts b{font-size:1.15rem;color:#5C3A00}
.chip{display:inline-block;font-size:.875rem;padding:3px 10px;border-radius:999px;background:var(--mint);color:var(--forest)}
.rsum{display:flex;gap:14px;align-items:center}
.rsum .reward-img{width:96px;flex:none;aspect-ratio:1/1;border-radius:16px;overflow:hidden}
.rsum .reward-img svg{width:56px;height:56px}
.bal{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;font-family:'Kanit'}
.bal b{font-size:1.25rem;color:var(--forest-2)}
.bal.last{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}
.bal.last b{font-size:1.5rem;color:#5C3A00}
.methods{display:grid;gap:10px;margin:6px 0 4px}
.method{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;background:#fff}
.method input{width:22px;height:22px;min-height:0;margin-top:3px;accent-color:var(--forest);flex:none}
.method > span{display:flex;flex-direction:column;line-height:1.4}
.method:has(input:checked){border-color:var(--forest);background:var(--mint)}
.method.off{opacity:.5;cursor:not-allowed}
.coupon{font-family:'Kanit';font-size:2rem;font-weight:700;letter-spacing:2px;border:2px dashed var(--amber);border-radius:16px;padding:8px 22px;display:inline-block;background:var(--amber-soft);color:#5C3A00;margin:6px 0}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.rw-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rw-row:last-child{border-bottom:0}
.rw-thumb{width:64px;height:64px;border-radius:14px;overflow:hidden;flex:none}
.rw-thumb .reward-img{width:100%;height:100%;aspect-ratio:auto}
.rw-thumb img{width:100%;height:100%;object-fit:cover}
.rw-thumb svg{width:40px;height:40px}
.rw-row.off{opacity:.55}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:8px}
.imgs .im{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);background:#F4F7F5}
.imgs .im img{width:100%;height:100%;object-fit:cover}
.imgs .im .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1rem;cursor:pointer}
.imgs .im .cover{position:absolute;left:4px;bottom:4px;font-size:.875rem;font-family:'Kanit';background:var(--forest);color:#fff;border-radius:8px;padding:1px 6px}
.imgs .im .mk{position:absolute;left:4px;bottom:4px;font-size:.875rem;font-family:'Kanit';background:rgba(255,255,255,.9);color:var(--forest-2);border:0;border-radius:8px;padding:2px 6px;cursor:pointer}
.imgs .add{display:grid;place-items:center;aspect-ratio:1/1;border-radius:14px;border:2px dashed var(--mint-2);color:var(--forest);font-family:'Kanit';font-size:.875rem;text-align:center;cursor:pointer;background:#FBFDFB}
.gallery{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.gallery button{flex:none;width:64px;height:64px;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:none}
.gallery button.on{border-color:var(--forest)}
.gallery img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{font-family:'Kanit';border:1.5px solid var(--line);background:#fff;color:var(--forest-2);border-radius:999px;padding:8px 14px;font-size:.92rem;cursor:pointer;min-height:42px}
.chips button.on{background:var(--forest);border-color:var(--forest);color:#fff}

/* ---------- Notices ---------- */
.notice{border-radius:16px;padding:14px 16px;background:var(--mint);color:var(--forest-2);font-size:.95rem}
.notice.amber{background:var(--amber-soft);color:#6B4A00}
.notice.err{background:var(--danger-soft);color:var(--danger)}

/* ---------- Steps ---------- */
.steps{counter-reset:s;display:grid;gap:12px}
.step{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.step::before{counter-increment:s;content:counter(s);flex:none;width:38px;height:38px;border-radius:12px;background:var(--forest);color:#fff;display:grid;place-items:center;font-family:'Kanit';font-weight:600;font-size:1.1rem}
.step h3{margin:2px 0 2px;font-size:1.05rem}
.step p{margin:0;color:var(--muted);font-size:.95rem}

/* ---------- Tables / lists ---------- */
.rate{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.rate:last-child{border-bottom:0}
.rate .nm{font-family:'Kanit';font-weight:500}
.rate .ds{font-size:.88rem;color:var(--muted)}
.list-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.plus{font-family:'Kanit';font-weight:600;color:var(--emerald-text);white-space:nowrap}
.minus{font-family:'Kanit';font-weight:600;color:var(--danger);white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{text-align:left;font-family:'Kanit';font-weight:500;color:var(--muted);font-size:.875rem;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl-wrap{overflow-x:auto}

/* ---------- Forms ---------- */
label.f{display:block;font-family:'Kanit';font-weight:500;color:var(--forest-2);margin:12px 0 6px;font-size:.98rem}
input,select,textarea{font:inherit;font-size:1.05rem;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);min-height:50px}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(27,156,133,.25);border-color:var(--emerald)}
.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:.93rem;color:#33413A}
.check input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px;accent-color:var(--forest)}
.row{display:flex;gap:10px;align-items:flex-end}
.row > *{flex:1}
.row > .btn{flex:none}
.hint{font-size:.875rem;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;background:var(--mint);padding:5px;border-radius:16px;margin-bottom:16px;overflow-x:auto}
.tab{flex:1;border:0;background:transparent;color:var(--forest-2);padding:10px 14px;border-radius:12px;font-size:.98rem;cursor:pointer;white-space:nowrap;min-height:44px}
.tab.on{background:#fff;box-shadow:var(--shadow);font-weight:600}

/* ---------- Member card ---------- */
.mcard{border-radius:24px;padding:20px;color:#fff;background:radial-gradient(circle at 100% 0%,rgba(255,176,0,.22),transparent 45%),linear-gradient(145deg,#1F6B4F 0%,#17553F 55%,#13463A 100%);box-shadow:0 12px 30px rgba(23,85,63,.25);max-width:520px}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mc-label{font-size:.875rem;opacity:.85}
.mc-name{font-family:'Kanit';font-size:1.35rem;font-weight:600;line-height:1.25}
.mc-body{display:flex;gap:16px;align-items:center;margin-top:16px}
.mc-qr{background:#fff;border-radius:14px;padding:8px;flex:none;width:148px;height:148px;display:grid;place-items:center;color:var(--ink);font-family:'Kanit';font-weight:600}
.mc-qr img,.mc-qr canvas{width:132px !important;height:132px !important}
.mc-id{font-family:'Kanit';font-size:1.45rem;font-weight:600;letter-spacing:1px}
.mc-points{font-family:'Kanit';font-size:2.5rem;font-weight:700;color:var(--amber);line-height:1.1}
.mc-points span{font-size:1rem;color:#fff;font-weight:500}
.mc-foot{margin-top:14px;font-size:.875rem;opacity:.85;border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.stat .v{font-family:'Kanit';font-size:1.6rem;font-weight:600;color:var(--forest-2);line-height:1.2}
.stat .k{font-size:.88rem;color:var(--muted)}
@media (min-width:760px){.stats.four{grid-template-columns:repeat(4,1fr)}}

/* ---------- Staff ---------- */
.found{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--mint);border-radius:16px;padding:14px 16px;margin-top:12px}
.found .nm{font-family:'Kanit';font-weight:600;font-size:1.1rem;color:var(--forest-2)}
.line-row{display:grid;grid-template-columns:1fr 110px 44px;gap:8px;align-items:center;margin-bottom:10px}
.line-row .lp{grid-column:1/-1;font-size:.88rem;color:var(--muted);margin-top:-4px}
.icon-btn{width:44px;height:50px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--danger);cursor:pointer;font-size:1.2rem}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--amber-soft);border-radius:16px;padding:14px 16px;margin-top:8px;font-family:'Kanit'}
.total b{font-size:1.6rem;color:#5C3A00}
.photo-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--mint-2);border-radius:18px;padding:22px;text-align:center;cursor:pointer;color:var(--forest);font-family:'Kanit';background:#FBFDFB}
.photo-drop input{display:none}
.photo-prev{border-radius:16px;max-height:280px;object-fit:cover;width:100%;margin-top:10px}
#scanner{margin-top:10px;border-radius:16px;overflow:hidden}
.success{text-align:center;padding:28px 20px}
.success .big{font-family:'Kanit';font-size:3rem;font-weight:700;color:var(--emerald);line-height:1}

/* ---------- Footer: แถบอ่อน + แถบเข้ม ---------- */
footer{margin-top:auto}
.foot-strip{background:linear-gradient(110deg,#E2F2E4 0%,#F6F4E1 100%);padding:18px 0;border-top:1px solid rgba(23,85,63,.06)}
.foot-strip .wrap,.foot-bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap}
.foot-brand{font-family:'Kanit';color:var(--forest-2)}
.foot-brand b{font-weight:600}
.foot-brand span{color:var(--emerald-text);margin-left:8px}
.foot-links{display:flex;gap:18px;flex-wrap:wrap}
.foot-links a{color:var(--forest-2);font-size:.95rem;text-underline-offset:4px}
.foot-bar{background:var(--ink);color:#fff;padding:16px 0;font-size:.92rem}
.foot-bar b{font-weight:600}
.socials{display:flex;gap:8px}
.socials a{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.09);color:#fff;text-decoration:none;transition:background .15s}
.socials a:hover{background:rgba(255,255,255,.18)}
.socials a[hidden]{display:none}
.socials .line{font-family:'Kanit';font-weight:600;font-size:.8rem;letter-spacing:.3px}
.foot-bar a:focus-visible{outline-color:#fff}

/* ---------- Toast / loading ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100vw - 32px);font-size:.95rem;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--danger)}
.skeleton{height:120px;border-radius:var(--radius);background:linear-gradient(90deg,#eef4f0,#f7faf8,#eef4f0);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- การเข้าถึง ---------- */
a:focus-visible,button:focus-visible,.btn:focus-visible,.tab:focus-visible,.method:focus-within,.chips button:focus-visible,summary:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

@media print{
  body{background:#fff}
  .topbar,.demo,footer,.drawer,.drawer-bg,.no-print{display:none !important}
  main{padding:0}
  #toast,.mc-pts-wrap{display:none !important}
  /* บัตรขนาด ID-1 (เท่าบัตรเครดิต) 85.6 × 54 มม. */
  .mcard{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none;width:85.6mm;height:53.98mm;max-width:none;padding:3.5mm 4mm;border-radius:3mm;overflow:hidden}
  .mc-top svg{width:8mm;height:8mm}
  .mc-label{font-size:6.5pt}
  .mc-name{font-size:10.5pt}
  .mc-body{margin-top:1.5mm;gap:4mm}
  .mc-qr{width:29mm;height:29mm;padding:1.5mm;border-radius:2mm}
  .mc-qr img,.mc-qr canvas{width:26mm !important;height:26mm !important}
  .mc-id{font-size:13pt}
  .mc-foot{display:none}
  .mc-print-note{display:block !important;font-size:6.5pt;margin-top:2mm;opacity:.9}
}
</style>

<script>
/* =========================================================
 *  ตั้งค่า: วาง Web app URL จาก Apps Script ระหว่าง ' '
 *  ถ้าเว้นว่างไว้ = โหมดทดลอง (ข้อมูลไม่ถูกบันทึกจริง)
 * ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwVSoPA1iyRfRX1KdIjylG5rqAZoJ6t82A0Kac3Q930vsq2FoBiksU12UST2elOS_qD/exec';

const DEMO = !API_URL;
const MOCK_DELAY = (d => d === null ? 250 : Math.max(0, Number(d) || 0))(new URLSearchParams(location.search).get('delay')); // โหมดทดลอง: จำลองเวลารอ (?delay=มิลลิวินาที)
const CAT = { household:'สินค้าจำเป็นในครัวเรือน', local:'สินค้าและบริการในตลิ่งชัน', green:'สินค้ากรีนและอัปไซเคิล' };
const STATUS = {
  pending:['รอดำเนินการ','#FFF4D6','#7A4B00'],
  preparing:['กำลังเตรียมของ','#E6F6FA','#006F87'],
  shipped:['จัดส่งแล้ว','#E7F3EC','#17553F'],
  done:['ได้รับของแล้ว','#17553F','#FFFFFF'],
  cancelled:['ยกเลิก · คืนแต้มแล้ว','#FDECE4','#B4400E']
};
const METHOD = { coupon:'คูปอง', pickup:'รับที่จุดรับขยะ', volunteer:'อาสาสมัครส่งถึงบ้าน', post:'ส่งทางขนส่ง' };
function dropName(id){ return ((S.pub && S.pub.dropoffs.find(d => d.id === id)) || {}).name || ''; }
function stChip(s){ const x = STATUS[s] || [s,'#EEE','#333']; return `<span class="chip" style="background:${x[1]};color:${x[2]};white-space:nowrap">${x[0]}</span>`; }
const NAV = [
  ['', 'หน้าแรก', 'home'],
  ['member', 'ข้อมูลสมาชิก', 'user'],
  ['rewards', 'แลกของรางวัล', 'gift'],
  ['dropoff', 'จุดรับขยะ', 'pin'],
  ['contact', 'ติดต่อเรา', 'chat']
];

/* ---------- storage ---------- */
function load(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function save(k,v){ try{ v ? localStorage.setItem(k,v) : localStorage.removeItem(k); }catch(e){} }
function loadJSON(k){ try{ return JSON.parse(load(k) || 'null'); }catch(e){ return null; } }
function saveJSON(k,v){ save(k, v == null ? '' : JSON.stringify(v)); }

/* ข้อมูลที่จำไว้ในเครื่อง แยกตามระบบหลังบ้าน (ทดลอง/จริง) จะได้ไม่ปนกัน */
const KEY_SUFFIX = DEMO ? 'demo' : API_URL.replace(/[^A-Za-z0-9]/g, '').slice(-10);
const PUB_KEY = 'yd_pub_' + KEY_SUFFIX, ME_KEY = 'yd_me_' + KEY_SUFFIX;
/* ค่าเริ่มต้นตอนเปิดเว็บครั้งแรก ใช้แสดงส่วนที่ไม่ต้องรอข้อมูลได้ทันที */
const DEFAULT_PUB = () => ({
  settings:{ siteName:'อยู่ดีมีแต้ม', logoUrl:'', facebookPage:'', email:'YoodeeMeetaem@gmail.com', dataController:'สุธินี ศรีนอก',
    dataControllerAddress:'40 ถนนจรัญสนิทวงศ์ ซอย 73 แขวงบางพลัด เขตบางพลัด กรุงเทพมหานคร 10700',
    brandFacebook:'https://www.facebook.com/yoodeemeetaem/', brandLine:'https://lin.ee/q4KuQkd', pointsPerBaht:'10', postMinPoints:'500', heroImageUrl:'' },
  wasteTypes:[], rewards:[], dropoffs:[]
});

const S = {
  pub:null, pubLoaded:false, pubReq:null, pubError:'', waitPubRoute:null,
  mtoken:load('yd_mtoken'), me:null, meReq:null, meAt:0,
  stoken:load('yd_stoken'), staff:loadJSON('yd_staff'), sb:null, sbReq:null, sbAt:0, sbKeyAt:{}, sbUnsupported:false, upUnsupported:false,
  touched:false, homeIds:null
};
if(S.mtoken) S.me = loadJSON(ME_KEY);

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function n(v){ return Number(v || 0).toLocaleString('th-TH', {maximumFractionDigits:2}); }
function dt(s){ const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('th-TH', {dateStyle:'medium', timeStyle:'short'}); }
function view(html){ $('#app').innerHTML = html; S.touched = false; }
function skel(h=120){ return `<div class="skeleton" style="height:${h}px"></div>`; }
function skelCards(k=3){ return Array.from({length:k}, () => skel(300)).join(''); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
/* ผู้ใช้กำลังพิมพ์หรือแก้ฟอร์มอยู่ไหม (ถ้าใช่ จะไม่วาดหน้าใหม่ทับ) */
document.addEventListener('input', e => { if(e.target.closest && e.target.closest('#app')) S.touched = true; }, true);
function formBusy(){ const a = document.activeElement; return S.touched || !!(a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
let toastT;
function toast(msg, isErr){ const t=$('#toast'); t.textContent=msg; t.className='show'+(isErr?' err':''); clearTimeout(toastT); toastT=setTimeout(()=>t.className='', 3200); }
async function busy(btn, fn){
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังทำงาน...';
  try{ return await fn(); }
  catch(e){ toast(e.message || 'เกิดข้อผิดพลาด', true); }
  finally{ if(btn.isConnected){ btn.disabled = false; btn.innerHTML = old; } }
}
function fbUrl(k){ return (S.pub && S.pub.settings[k]) || ''; }
function link(text, url, bold){ const t = bold ? `<b>${esc(text)}</b>` : esc(text); return url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${t}</a>` : t; }
function loadScript(src){ return new Promise((res,rej) => { const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('โหลดไฟล์เสริมไม่ได้')); document.head.appendChild(s); }); }

/* ---------- icons ---------- */
function capSvg(size=44, ring='#1F6B4F', fill='#E7F3EC'){
  let r=''; for(let i=0;i<24;i++){ const a=i/24*Math.PI*2; r+=`<circle cx="${(32+27.5*Math.cos(a)).toFixed(2)}" cy="${(32+27.5*Math.sin(a)).toFixed(2)}" r="3.6"/>`; }
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><g fill="${ring}">${r}<circle cx="32" cy="32" r="27.5"/></g><circle cx="32" cy="32" r="20.5" fill="${fill}"/><path d="M23 41c0-10.5 7.5-18 18-18 0 10.5-7.5 18-18 18z" fill="#1B9C85"/><path d="M23.5 40.5L34 30" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="42" cy="41" r="4.2" fill="#FFB000"/></svg>`;
}
const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
  gift:'<rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8S10 3 7.5 4.5 9 8 12 8zm0 0s2-5 4.5-3.5S15 8 12 8z"/>',
  pin:'<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  recycle:'<path d="M7 19H4l3-5M17 19h3l-3-5M12 4l-2 3.5M12 4l2 3.5M8.5 9.5L12 4l3.5 5.5M5.5 14l3-5.5M18.5 14l-3-5.5M7 19h10"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  qr:'<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/>'
};
function ic(name, size=22){ return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]||''}</svg>`; }
function rewardArt(cat){
  const bg = {household:'#E6F6FA', local:'#FFF4D6', green:'#E7F3EC'}[cat] || '#E7F3EC';
  const fg = {household:'#00A8CC', local:'#C98A00', green:'#1B9C85'}[cat] || '#1B9C85';
  const shape = {
    household:'<path d="M42 22h16v10l6 8v38a6 6 0 0 1-6 6H42a6 6 0 0 1-6-6V40l6-8z" fill="FG" opacity=".9"/><rect x="40" y="50" width="20" height="16" rx="3" fill="#fff" opacity=".8"/>',
    local:'<path d="M20 44l6-16h48l6 16z" fill="FG"/><rect x="24" y="44" width="52" height="34" rx="4" fill="FG" opacity=".55"/><rect x="42" y="58" width="16" height="20" rx="2" fill="#fff" opacity=".85"/>',
    green:'<path d="M28 78c0-30 20-50 48-50 0 30-20 50-48 50z" fill="FG"/><path d="M30 76l28-28" stroke="#fff" stroke-width="4" stroke-linecap="round"/>'
  }[cat] || '';
  return `<div class="reward-img" style="background:${bg}"><svg width="96" height="96" viewBox="0 0 100 100" aria-hidden="true">${shape.replaceAll('FG', fg)}</svg></div>`;
}

/* =========================================================
 *  API
 * ========================================================= */
async function api(action, payload={}, token=''){
  const t0 = performance.now();
  let data;
  if(DEMO){
    await new Promise(r=>setTimeout(r, MOCK_DELAY));
    try{ data = mockApi(action, JSON.parse(JSON.stringify(payload)), token); }
    catch(e){
      console.info(`[api] ${action} ${Math.round(performance.now()-t0)}ms (ทดลอง) ผิดพลาด: ${e.message}`);
      if(e.code === 'AUTH') onAuthExpired(action);
      throw e;
    }
    console.info(`[api] ${action} ${Math.round(performance.now()-t0)}ms (ทดลอง)`);
    return JSON.parse(JSON.stringify(data ?? null));   // ส่งสำเนา เหมือนข้อมูลที่ได้จากระบบจริง
  }
  let res;
  try{ res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action, payload, token }) }); }
  catch(e){ throw new Error('เชื่อมต่อระบบไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'); }
  let j; try{ j = await res.json(); }catch(e){ throw new Error('ระบบตอบกลับไม่ถูกต้อง'); }
  console.info(`[api] ${action} ${Math.round(performance.now()-t0)}ms` + (j.ms !== undefined ? ` (หลังบ้าน ${j.ms}ms)` : ''));
  if(!j.ok){
    if(j.code === 'AUTH') onAuthExpired(action);
    throw new Error(j.error || 'เกิดข้อผิดพลาด');
  }
  return j.data;
}
function onAuthExpired(action){
  if(/^(staff|admin)/.test(action)) clearStaff();
  else clearMember();
  setTimeout(route, 50);
}
function clearMember(){ S.mtoken=''; S.me=null; save('yd_mtoken',''); save(ME_KEY,''); }
function clearStaff(){ S.stoken=''; S.staff=null; S.sb=null; S.sbAt=0; S.sbKeyAt={}; save('yd_stoken',''); save('yd_staff',''); }
const isUnknownAction = e => /ไม่รู้จักคำสั่ง/.test(e && e.message || '');

/* ---------- ข้อมูลสาธารณะ: แสดงจากที่จำไว้ทันที แล้วอัปเดตเบื้องหลัง ---------- */
const PUB_PAGES = ['', 'earn', 'rewards', 'dropoff', 'contact', 'privacy'];
function refreshPublic(){
  if(S.pubReq) return S.pubReq;
  S.pubReq = (async () => {
    try{
      const d = await api('publicData');
      const changed = JSON.stringify(d) !== JSON.stringify(S.pub), wasLoaded = S.pubLoaded;
      S.pub = d; S.pubLoaded = true; S.pubError = ''; saveJSON(PUB_KEY, d);
      if(changed || !wasLoaded){
        renderShell();
        const r = curRoute();
        if(S.waitPubRoute === r && !formBusy()) rerender();
        else if(changed && PUB_PAGES.includes(r) && !formBusy()) rerender();
      }
      S.waitPubRoute = null;
      return d;
    }catch(e){
      if(!S.pubLoaded){ S.pubError = e.message; if(S.waitPubRoute === curRoute()) rerender(); }
      throw e;
    }finally{ S.pubReq = null; }
  })();
  return S.pubReq;
}
function whenPub(){ return S.pubLoaded ? Promise.resolve(S.pub) : refreshPublic(); }
/* หน้าที่ต้องใช้ข้อมูลแต่ยังไม่มี: แสดงโครงไว้ก่อน แล้ววาดใหม่เมื่อข้อมูลมาถึง */
function waitPub(){
  S.waitPubRoute = curRoute();
  if(S.pubError) return `<div class="notice err">โหลดข้อมูลไม่ได้: ${esc(S.pubError)} <button class="btn btn-soft btn-sm" id="retryPub" style="margin-left:6px">ลองใหม่</button></div>`;
  return '';
}
document.addEventListener('click', e => {
  if(e.target.closest && e.target.closest('#retryPub')){ S.pubError = ''; rerender(); refreshPublic().catch(()=>{}); }
});

function setMe(d){ S.me = d; S.meAt = Date.now(); saveJSON(ME_KEY, d); }
/* ข้อมูลสมาชิกเพิ่งได้จากระบบไม่เกิน 10 วินาที (เช่น เพิ่งเข้าสู่ระบบหรือเพิ่งแลกของ) ไม่ต้องขอซ้ำ */
function meFresh(){ return !!S.me && Date.now() - S.meAt < 10000; }
function refreshMe(){
  if(!S.mtoken) return Promise.reject(new Error('กรุณาเข้าสู่ระบบ'));
  if(S.meReq) return S.meReq;
  const tok = S.mtoken;
  S.meReq = api('memberMe', {}, tok).then(d => { if(S.mtoken === tok) setMe(d); return d; }).finally(() => { S.meReq = null; });
  return S.meReq;
}

function homePicks(){

/* เข้าสู่ระบบ/สมัครสำเร็จ: หลังบ้านส่งข้อมูลหน้าสมาชิกมาพร้อมกันแล้ว ไม่ต้องขอซ้ำ */
function afterAuth(d, msg){
  S.mtoken = d.token; save('yd_mtoken', d.token);
  if(Array.isArray(d.history)) setMe({ member:d.member, history:d.history, redemptions:d.redemptions || [], lastShipping:d.lastShipping || null });
  else { S.me = null; save(ME_KEY, ''); }   // หลังบ้านรุ่นเก่า: หน้าสมาชิกจะขอข้อมูลเอง
  toast(msg);
  if(S.afterLogin){ const t = S.afterLogin; S.afterLogin = ''; location.hash = t; } else memberHome();
}
async function memberHome(){
  if(S.me){
    const fresh = meFresh();
    renderMember(S.me, !fresh);
    if(fresh) return;
    const before = JSON.stringify(S.me);
    refreshMe().then(d => {
      if(curRoute() !== 'member' || !S.mtoken) return;
      if(JSON.stringify(d) !== before) renderMember(d, false);
      else { const s = $('#meSync'); if(s) s.remove(); }
    }).catch(() => { const s = $('#meSync'); if(s) s.textContent = 'อัปเดตข้อมูลล่าสุดไม่ได้ แสดงข้อมูลที่บันทึกไว้'; });
    return;
  }
  view(skel(260) + '<div style="height:14px"></div>' + skel(160));
  let d;
  try{ d = await refreshMe(); }
  catch(e){ if(!S.mtoken) return pageMember(); if(curRoute() === 'member') view(`<div class="notice err">${esc(e.message)}</div>`); return; }
  if(curRoute() === 'member' && S.mtoken) renderMember(d, false);
}

/* โหลดตัวสร้าง QR เฉพาะตอนต้องใช้ หน้าอื่นจะได้ไม่ต้องรอ */
let qrLib = null;
function loadQR(){ return qrLib || (qrLib = loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').catch(e => { qrLib = null; throw e; })); }
async function drawQR(el, text){
  if(!el) return;
  el.textContent = text;
  try{ if(!window.QRCode) await loadQR(); }catch(e){ return; }
  if(!el.isConnected || !window.QRCode) return;
  el.textContent = '';
  new QRCode(el, { text, width:132, height:132, colorDark:'#13463A', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
}

  setTimeout(() => $$('.gallery button').forEach(b => b.onclick = () => { $('#gMain').src = b.dataset.u; $$('.gallery button').forEach(x => x.classList.toggle('on', x === b)); }), 0);
  return `${gallery}<div class="card rsum">${rewardImg(r)}<div><span class="chip">${esc(CAT[r.category] || r.category)}</span><div class="reward-name" style="margin:4px 0">${esc(r.name)}</div>${r.description ? `<div class="small muted" style="margin-bottom:6px">${esc(r.description)}</div>` : ''}${r.sponsor ? `<div class="small muted" style="margin-bottom:6px">สนับสนุนโดย <b>${esc(r.sponsor)}</b></div>` : ''}<span class="pts"><b>${n(r.points)}</b> แต้ม</span></div></div>`;

    try{ await refreshMe(); }
    catch(e){ if(!S.mtoken) return; if(curRoute() === 'redeem') redeemWrap(`<div class="notice err">${esc(e.message)}</div>`); return; }
    if(curRoute() !== 'redeem' || qp('id') !== id) return;
    renderRedeem(r, S.me);
    return;
  }
  // แสดงจากข้อมูลที่จำไว้ทันที แล้วเช็กแต้มล่าสุดเบื้องหลัง (ถ้าแต้มดูเหมือนไม่พอ เช็กเสมอ เผื่อเพิ่งได้แต้มเพิ่ม)
  renderRedeem(r, S.me);
  if(meFresh() && S.me.member.points >= r.points) return;
  const pts0 = S.me.member.points;
  refreshMe().then(d => {
    if(curRoute() !== 'redeem' || qp('id') !== id || d.member.points === pts0) return;
    const enough0 = pts0 - r.points >= 0, enough1 = d.member.points - r.points >= 0;
    if(enough0 !== enough1 && !formBusy()) renderRedeem(r, d);
    else { const a = $('#balMine'), b = $('#balAfter'); if(a) a.textContent = n(d.member.points); if(b && enough1) b.textContent = n(d.member.points - r.points); }
  }).catch(()=>{});
}

      <h2>รับเป็นคูปอง</h2>
      <div class="notice">หลังยืนยัน คุณจะได้ <b>รหัสคูปอง</b> นำไปแสดงที่ร้านเพื่อใช้สิทธิ์ ไม่ต้องรอจัดส่ง ดูรหัสย้อนหลังได้ที่หน้าข้อมูลสมาชิก</div>` : `

/* อัปเดตข้อมูลในเครื่องจากผลการแลก หน้าสมาชิกและหน้าของรางวัลจะแสดงค่าใหม่ทันทีโดยไม่ต้องขอซ้ำ */
function afterRedeem(r, payload, res){
  const now = new Date().toISOString();
  if(S.me){
    S.me.member.points = res.balance;
    S.me.redemptions = [{ redeemId:res.redeemId, rewardId:r.id, rewardName:res.rewardName, points:res.points, status:'pending', statusNote:'', createdAt:now, updatedAt:now, method:res.method, dropoffId:payload.dropoffId || '' }].concat(S.me.redemptions || []);
    S.me.history = [{ createdAt:now, type:'redeem', wasteName:'แลก: ' + res.rewardName, quantity:0, unit:'', points:-res.points, note:res.redeemId }].concat(S.me.history || []);
    if(payload.address) S.me.lastShipping = { recipientName:payload.recipientName, phone:payload.phone, address:payload.address, otherContact:payload.otherContact || '' };
    setMe(S.me);
  }
  if('stock' in res){
    const pr = S.pub.rewards.find(x => x.id === r.id);
    if(pr && res.stock !== '') { pr.stock = res.stock; saveJSON(PUB_KEY, S.pub); }
  } else refreshPublic().catch(()=>{});   // หลังบ้านรุ่นเก่า
}

/* =========================================================
 *  เจ้าหน้าที่ / แอดมิน
 *  โหลดข้อมูลทุกแท็บในคำขอเดียว (staffBootstrap) สลับแท็บได้ทันที
 * ========================================================= */
function loadStaffData(){
  if(!S.stoken) return Promise.resolve(null);
  if(S.sbUnsupported) return Promise.resolve(null);
  if(S.sbReq) return S.sbReq;
  const tok = S.stoken;
  S.sbReq = api('staffBootstrap', {}, tok).then(d => {
    if(S.stoken !== tok) return null;
    const roleBefore = S.staff && S.staff.role;
    S.sb = Object.assign(S.sb || {}, d); S.sbAt = Date.now();
    if(d.staff){ S.staff = d.staff; save('yd_staff', JSON.stringify(d.staff)); }
    if(d.staff && roleBefore && d.staff.role !== roleBefore && curRoute() === 'staff' && !formBusy()) { renderShell(); pageStaff(); }
    return S.sb;
  }).catch(e => { if(isUnknownAction(e)){ S.sbUnsupported = true; return null; } throw e; })
    .finally(() => { S.sbReq = null; });
  return S.sbReq;
}
/* ข้อมูลของแท็บ: ใช้ที่มีอยู่ ถ้ายังไม่มี รอ bootstrap หรือ (หลังบ้านรุ่นเก่า) ขอเฉพาะแท็บนั้น */
async function sbGet(key, action, payload){
  if(S.sb && S.sb[key] !== undefined) return S.sb[key];
  const d = await loadStaffData();
  if(d && d[key] !== undefined) return d[key];
  const v = await api(action, payload || {}, S.stoken);
  S.sb = S.sb || {}; S.sb[key] = v; S.sbKeyAt[key] = Date.now();
  return v;
}
/* ข้อมูลเก่ากว่า 30 วินาที: ขอใหม่เบื้องหลัง แล้ววาดแท็บนี้ใหม่ถ้ายังไม่ได้แก้อะไรอยู่ */
const TAB_SRC = { record:['recent','staffRecent'], summary:['summary','adminSummary'], redeems:['redemptions','adminRedemptions',{ status:'' }], rewards:['rewards','adminRewards'],
  types:['wasteTypes','adminWasteTypes'], members:['members','adminMembers',{ q:'' }], staffs:['staffList','adminStaff'], settings:['settings','adminSettings'] };
function redrawTab(tab){
  if(curRoute() !== 'staff' || staffTab !== tab) return;
  if(tab === 'record') drawRecent(S.sb.recent || []);   // วาดเฉพาะรายการล่าสุด ไม่กระทบฟอร์มที่กรอกอยู่
  else if(!formBusy()) renderTab();
}
function maybeRefreshStaff(tab){
  if(S.sbUnsupported){
    // หลังบ้านรุ่นเก่า (ยังไม่มี staffBootstrap): ขอข้อมูลของแท็บนี้ใหม่เบื้องหลัง
    const src = TAB_SRC[tab], key = src && src[0];
    if(!src || Date.now() - (S.sbKeyAt[key] || 0) < 30000) return;
    S.sbKeyAt[key] = Date.now();
    api(src[1], src[2] || {}, S.stoken).then(v => {
      S.sb = S.sb || {};
      const changed = JSON.stringify(S.sb[key]) !== JSON.stringify(v);
      S.sb[key] = v;
      if(changed) redrawTab(tab);
    }).catch(()=>{});
    return;
  }
  if(S.sbReq || Date.now() - S.sbAt < 30000) return;
  loadStaffData().then(d => { if(d) redrawTab(tab); }).catch(()=>{});
}
function staleStaff(){ S.sbAt = 0; S.sbKeyAt = {}; }

/* แสดงแท็บจากข้อมูลที่มี ถ้ายังไม่มีแสดงโครงไว้ก่อน */
async function withTabData(tab, key, action, payload, draw){
  const has = S.sb && S.sb[key] !== undefined;
  if(!has) $('#sBody').innerHTML = skel(160);
  let data;
  try{ data = has ? S.sb[key] : await sbGet(key, action, payload); }

  if(curRoute() !== 'staff' || staffTab !== tab || !$('#sBody')) return;
  draw(data);
  maybeRefreshStaff(tab);
}

async function findMember(q){
  const local = localMember(q);
  if(local){
    // แอดมินมีรายชื่อสมาชิกในเครื่องแล้ว แสดงทันที แล้วเช็กแต้มล่าสุดเบื้องหลัง
    await showFound(local);
    api('staffFindMember', { query:q }, S.stoken).then(m => {
      if(!R.member || R.member.memberId !== m.memberId) return;
      R.member = m; const b = $('#found .pts b'); if(b) b.textContent = n(m.points);
    }).catch(()=>{});
    return;
  }
  await showFound(await api('staffFindMember', { query:q }, S.stoken));
}
/* ค้นจากรายชื่อสมาชิกที่โหลดไว้ (เฉพาะแอดมิน) ใช้กติกาเดียวกับระบบหลังบ้าน */
function localMember(q){
  const list = S.sb && S.sb.members; if(!Array.isArray(list)) return null;
  q = String(q || '').trim();
  let m = null;
  const id = q.match(/^yd-?(\d+)$/i);
  if(id){ const mid = 'YD-' + String(Number(id[1])).padStart(4, '0'); m = list.find(x => x.memberId === mid); }
  else {
    let d = q.replace(/\D/g, '');
    if(d.startsWith('66') && d.length === 11) d = '0' + d.slice(2);
    if(/^0\d{8,9}$/.test(d)) m = list.find(x => String(x.phone) === d);
  }
  if(!m) return null;
  const ph = String(m.phone || '');
  return { memberId:m.memberId, name:m.name, phoneMasked: ph.length >= 4 ? ph.slice(0,3) + '-xxx-' + ph.slice(-4) : '', points:m.points, totalKg:m.totalKg };
}
async function showFound(m){
  R.member = m;
  $('#newMem').innerHTML = '';
  $('#found').innerHTML = `<div class="found"><div><div class="nm">${esc(m.name)}</div><div class="small muted">${esc(m.memberId)} · ${esc(m.phoneMasked)}</div></div><span class="pts"><b>${n(m.points)}</b> แต้ม</span></div>`;
  await whenPub();
  if(!R.lines.length) R.lines = [{ wasteTypeId: (S.pub.wasteTypes[0]||{}).id || '', quantity:'' }];
  renderStep2();
}

function lineOptions(sel){ return S.pub.wasteTypes.map(t => `<option value="${esc(t.id)}" ${t.id===sel?'selected':''}>${esc(t.name)} (${n(t.pointsPerUnit)}/${esc(t.unit)})</option>`).join(''); }

function linePoints(l){ const t = S.pub.wasteTypes.find(x => x.id === l.wasteTypeId); return t ? rp((Number(l.quantity)||0) * t.pointsPerUnit) : 0; }

    R.prep = (async () => {
      let data;
      try{ data = await compressImage(f, 1280, .72); }
      catch(err){ if(seq === photoSeq) toast(err.message, true); return; }
      if(seq !== photoSeq) return;
      R.photo = data;
      const pv = $('#pPrev'); if(pv){ pv.src = data; pv.hidden = false; $('#pDrop').querySelector('span').textContent = 'แตะเพื่อถ่ายใหม่'; }
      if(S.upUnsupported) return;   // หลังบ้านรุ่นเก่า: ส่งรูปพร้อมการบันทึก
      setPhotoStatus('กำลังส่งรูป...');

        .then(res => { if(seq === photoSeq){ R.photoId = res.photoId; setPhotoStatus('ส่งรูปแล้ว'); } })

function drawLines(){
  const unitOf = id => (S.pub.wasteTypes.find(t => t.id === id) || {}).unit || '';
  $('#lines').innerHTML = R.lines.map((l,i) => `
    <div class="line-row">
      <select data-i="${i}" class="lt">${lineOptions(l.wasteTypeId)}</select>

      <button class="icon-btn" data-i="${i}" aria-label="ลบรายการ" ${R.lines.length<2?'disabled':''}>×</button>
      <div class="lp" id="lp${i}">= ${n(linePoints(l))} แต้ม</div>
    </div>`).join('');
  $$('#lines .lt').forEach(s => s.onchange = () => { R.lines[s.dataset.i].wasteTypeId = s.value; drawLines(); });
  $$('#lines .lq').forEach(s => s.oninput = () => { R.lines[s.dataset.i].quantity = s.value; $('#lp'+s.dataset.i).textContent = '= ' + n(linePoints(R.lines[s.dataset.i])) + ' แต้ม'; updTotal(); });
  $$('#lines .icon-btn').forEach(b => b.onclick = () => { R.lines.splice(Number(b.dataset.i),1); drawLines(); });
  updTotal();
}
function updTotal(){ $('#totalPts').textContent = n(rp(R.lines.reduce((a,l) => a + linePoints(l), 0))); }
async function saveRecord(){
  if(!R.member) throw new Error('กรุณาค้นหาสมาชิกก่อน');
  const items = R.lines.filter(l => Number(l.quantity) > 0);
  if(!items.length) throw new Error('กรุณาใส่น้ำหนักหรือจำนวนขยะ');
  if(R.prep) await R.prep;   // ถ้ารูปยังย่อหรือส่งไม่เสร็จ รอให้เสร็จก่อน
  const payload = { memberId:R.member.memberId, items, dropoffId:$('#dp').value, note:$('#nt').value };
  if(R.photoId) payload.photoId = R.photoId; else if(R.photo) payload.photo = R.photo;
  const d = await api('staffRecordWaste', payload, S.stoken);
  $('#found').innerHTML = ''; $('#step2').innerHTML = `
  <div class="card success" style="margin-top:14px">
    <div class="big">+${n(d.earned)}</div><p class="kanit" style="margin:.4em 0 0">แต้มให้ ${esc(d.name)} (${esc(d.memberId)})</p>
    <p class="muted" style="margin:.2em 0 1em">ยอดแต้มคงเหลือ ${n(d.balance)} แต้ม</p>
    <button class="btn btn-primary btn-lg" id="nextRec">บันทึกรายการถัดไป</button>
  </div>`;
  $('#nextRec').onclick = tabRecord;
  staleStaff();
  if(Array.isArray(d.recent)){
    // หลังบ้านส่งรายการที่เพิ่งบันทึกกลับมาแล้ว ไม่ต้องขอรายการใหม่
    S.sb = S.sb || {};
    const old = (S.sb.recent || []).filter(x => !d.recent.some(y => y.txId === x.txId));
    S.sb.recent = d.recent.concat(old).slice(0, 30);
    drawRecent(S.sb.recent);
  } else {
    api('staffRecent', {}, S.stoken).then(rs => { S.sb = S.sb || {}; S.sb.recent = rs; drawRecent(rs); }).catch(()=>{});
  }
}
function drawRecent(rs){
  const el = $('#recent'); if(!el) return;
  el.innerHTML = rs.map(r => `<div class="list-item"><div><div class="kanit">${esc(r.memberName)} <span class="muted small">${esc(r.memberId)}</span></div><div class="small muted">${esc(r.wasteName)}${r.quantity?` · ${n(r.quantity)} ${esc(r.unit)}`:''} · ${dt(r.createdAt)}${r.staffName?` · โดย ${esc(r.staffName)}`:''}${r.photoUrl?` · <a href="${esc(r.photoUrl)}" target="_blank" rel="noopener">ดูรูป</a>`:''}</div></div><div class="${r.points<0?'minus':'plus'}">${r.points>0?'+':''}${n(r.points)}</div></div>`).join('') || '<p class="muted">ยังไม่มีรายการ</p>';
}

let scanner = null;
async function startScanner(){
  try{
    if(!window.Html5Qrcode) await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
    stopScanner();
    scanner = new Html5Qrcode('scanner');
    await scanner.start({ facingMode:'environment' }, { fps:10, qrbox:220 }, async text => { stopScanner(); $('#fq').value = text; try{ await findMember(text); }catch(e){ toast(e.message,true); } });
  }catch(e){ toast('เปิดกล้องไม่ได้ ใช้การพิมพ์เบอร์หรือรหัสแทน', true); }
}
function stopScanner(){ if(scanner){ const s = scanner; scanner = null; s.stop().then(() => s.clear()).catch(()=>{}); } }

    <label class="check"><input type="checkbox" id="e_a" ${r.active!==false?'checked':''}><span><b>เปิดแสดง</b> บนหน้าเว็บ (ติ๊กออก = ซ่อน ข้อมูลยังอยู่)</span></label>
    <label class="f" for="e_o">ลำดับการแสดง</label><input id="e_o" type="number" min="1" step="1" value="${esc(r.sort || 1)}" style="max-width:140px">
    <div class="grid2" style="margin-top:18px"><button class="btn btn-primary btn-lg" id="e_save">บันทึก</button><button class="btn btn-ghost btn-lg" id="e_back">ยกเลิก</button></div>
  </div>`;
  const hint = () => {
    const c = Number($('#e_cost').value), p = Number($('#e_p').value);
    $('#e_ph').innerHTML = c > 0 && p > 0 ? (p < c * ppb ? `<span style="color:var(--danger)">ต่ำกว่าต้นทุน (ควรอย่างน้อย ${n(c * ppb)} แต้ม)</span>` : `≈ ฿${n(p / ppb)}`) : '';
  };
  $('#e_cost').oninput = hint; $('#e_p').oninput = hint; hint();
  $('#e_calc').onclick = () => { const c = Number($('#e_cost').value); if(c > 0){ $('#e_p').value = rp(c * ppb); hint(); } else toast('ใส่ต้นทุนก่อน', true); };
  const drawImgs = () => {
    const all = E.images.map(u => ({ src:u, kind:'old' })).concat(E.photos.map(u => ({ src:u, kind:'new' })));
    $('#e_imgs').innerHTML = all.map((x,i) => `<div class="im"><img src="${esc(x.src)}" alt=""><button class="x" data-i="${i}" aria-label="ลบรูป">×</button>${i === 0 ? '<span class="cover">รูปหลัก</span>' : `<button class="mk" data-m="${i}">ตั้งรูปหลัก</button>`}</div>`).join('')
      + (all.length < 6 ? `<label class="add">+ เพิ่มรูป<input type="file" id="e_f" accept="image/*" multiple hidden></label>` : '');
    const nOld = E.images.length;
    $$('#e_imgs .x').forEach(b => b.onclick = () => { const i = +b.dataset.i; if(i < nOld) E.images.splice(i,1); else E.photos.splice(i - nOld,1); S.touched = true; drawImgs(); });
    $$('#e_imgs .mk').forEach(b => b.onclick = () => {
      const i = +b.dataset.m;
      if(i < nOld){ E.images.unshift(E.images.splice(i,1)[0]); }
      else if(nOld === 0){ E.photos.unshift(E.photos.splice(i,1)[0]); }
      else toast('บันทึกรูปใหม่ก่อน แล้วค่อยตั้งเป็นรูปหลัก', true);
      S.touched = true; drawImgs();
    });
    if($('#e_f')) $('#e_f').onchange = async ev => {
      const files = [...ev.target.files].slice(0, 6 - all.length);
      for(const f of files){ try{ E.photos.push(await compressImage(f, 1200, .8)); }catch(err){ toast(err.message, true); } }
      S.touched = true; drawImgs();
    };
  };
  drawImgs();
  $('#e_back').onclick = () => { S.touched = false; tabRewards(); };
  $('#e_save').onclick = e => busy(e.currentTarget, async () => {
    const out = await api('adminSaveReward', {
      rewardId:r.rewardId || '', name:$('#e_n').value, category:$('#e_c').value, kind:($('input[name=e_k]:checked')||{}).value,
      cost:$('#e_cost').value, points:$('#e_p').value, stock:$('#e_s').value, description:$('#e_d').value, sponsor:$('#e_sp').value,
      active:$('#e_a').checked, sort:$('#e_o').value, images:E.images, newPhotos:E.photos
    }, S.stoken);
    S.sb = S.sb || {};
    S.sb.rewards = out && Array.isArray(out.list) ? out.list : await api('adminRewards', {}, S.stoken);
    toast('บันทึกของรางวัลแล้ว'); S.touched = false; tabRewards();
    refreshPublic().catch(()=>{});   // อัปเดตหน้าเว็บสาธารณะเบื้องหลัง ไม่ต้องรอ
  });
}

/* ---------- สมาชิก ---------- */
let memberQuery = '';
function tabMembers(q){
  if(q !== undefined) memberQuery = q;
  const box = $('#sBody');
  box.innerHTML = `<div class="card">
    <div class="row"><input id="mq" placeholder="ค้นหาชื่อ เบอร์ หรือรหัสสมาชิก" value="${esc(memberQuery)}"><button class="btn btn-primary" id="mqBtn">ค้นหา</button></div>
    <div id="mList" style="margin-top:12px">${skel(80)}</div></div>`;
  $('#mqBtn').onclick = () => tabMembers($('#mq').value.trim());
  $('#mq').onkeydown = e => { if(e.key === 'Enter') tabMembers($('#mq').value.trim()); };
  const show = list => { if(staffTab === 'members' && $('#mList')) drawMembers(list); };
  if(!memberQuery){
    withMembers(show);
  } else {
    api('adminMembers', { q:memberQuery }, S.stoken).then(show).catch(e => { toast(e.message,true); show([]); });
  }
}
async function withMembers(cb){
  try{ cb(S.sb && S.sb.members ? S.sb.members : await sbGet('members', 'adminMembers', { q:'' })); maybeRefreshStaff('members'); }
  catch(e){ toast(e.message, true); cb([]); }
}
function drawMembers(list){
  $('#mList').innerHTML = list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>สมาชิก</th><th>แต้ม</th><th>กก.</th><th></th></tr></thead><tbody>
    ${list.map(m => `<tr><td><div class="kanit">${esc(m.name)}</div><div class="small muted">${esc(m.memberId)} · ${esc(m.phone)}</div></td><td class="kanit">${n(m.points)}</td><td>${n(m.totalKg)}</td>
    <td style="white-space:nowrap"><button class="btn btn-soft btn-sm" data-pin="${esc(m.memberId)}">รีเซ็ต PIN</button> <button class="btn btn-ghost btn-sm" data-adj="${esc(m.memberId)}">ปรับแต้ม</button></td></tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">ไม่พบสมาชิก</p>';
  $$('[data-pin]').forEach(b => b.onclick = e => {
    const pin = prompt('ตั้ง PIN ใหม่ 6 หลักให้ ' + b.dataset.pin + '\n(ยืนยันตัวตนสมาชิกก่อนรีเซ็ต)'); if(!pin) return;
    busy(e.currentTarget, async () => { await api('adminResetPin', { memberId:b.dataset.pin, pin }, S.stoken); toast('รีเซ็ต PIN แล้ว'); });
  });
  $$('[data-adj]').forEach(b => b.onclick = e => {
    const delta = prompt('ปรับแต้ม ' + b.dataset.adj + '\nใส่จำนวน เช่น 10 (เพิ่ม) หรือ -10 (ลด)'); if(!delta) return;
    const note = prompt('เหตุผลในการปรับแต้ม (จำเป็น)'); if(!note) return;
    busy(e.currentTarget, async () => {
      const r = await api('adminAdjustPoints', { memberId:b.dataset.adj, delta, note }, S.stoken);
      toast('ปรับแล้ว คงเหลือ ' + n(r.balance) + ' แต้ม'); staleStaff();
      if(r.member){
        const upd = arr => (arr || []).map(x => x.memberId === r.member.memberId ? r.member : x);
        if(S.sb && S.sb.members) S.sb.members = upd(S.sb.members);
        drawMembers(upd(list));
      } else tabMembers();
    });
  });
}

function bindSt(){
  $$('#stBody .ss').forEach(b => b.onclick = e => {
    const tr = b.closest('tr');
    busy(e.currentTarget, async () => {
      const s = await api('adminSaveStaff', { staffId:tr.dataset.id, username:$('.su',tr).value, displayName:$('.sd',tr).value, role:$('.sr',tr).value, active:$('.sa',tr).checked, password:$('.sp',tr).value }, S.stoken);
      tr.dataset.id = s.staffId; $('.sp',tr).value = ''; $('.sp',tr).placeholder = 'เว้นว่าง = ไม่เปลี่ยน'; toast('บันทึก ' + s.username + ' แล้ว');
      if(s.token){ S.stoken = s.token; save('yd_stoken', s.token); }   // เปลี่ยนรหัสผ่านตัวเอง: ได้บัตรผ่านใหม่ ไม่ต้องเข้าระบบใหม่
      if(Array.isArray(s.list)){ S.sb = S.sb || {}; S.sb.staffList = s.list; }
      if(S.staff && s.staffId === S.staff.staffId){ S.staff = Object.assign({}, S.staff, { username:s.username, displayName:s.displayName, role:s.role }); save('yd_staff', JSON.stringify(S.staff)); renderShell(); }
    });
  });
}

/* ---------- ย่อรูป ---------- */
function compressImage(file, max, q){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('อ่านไฟล์รูปไม่ได้')); };
    img.src = url;
  });
}

      const m = M.members.find(x => x.memberId === memberId); if(!m) err('ไม่พบสมาชิก');
      let bal = m.points, kg = m.totalKg, earned = 0; const now = new Date().toISOString(), stamp = Date.now();
      const txs = lines.map((l, i) => {
        bal = rp(bal + l.pts); earned = rp(earned + l.pts); if(/กก|kg/i.test(l.t.unit)) kg += l.q;
        return { txId:'TX'+stamp+i, memberId, type:'earn', wasteTypeId:l.t.wasteTypeId, wasteName:l.t.name, quantity:l.q, unit:l.t.unit, points:l.pts, balanceAfter:bal, photo, dropoffId:String(p.dropoffId||''), staffId:st.staffId, note:String(p.note||'').trim(), createdAt:now, saleValue:r2(l.q * (l.t.salePrice || 0)) };
      });
      M.tx.push(...txs); m.points = bal; m.totalKg = r2(kg);
      if(p.photoId) delete M.photos[p.photoId];
      return { memberId, name:m.name, earned, balance:bal, lines:lines.map(l => ({ name:l.t.name, quantity:l.q, unit:l.t.unit, points:l.pts })), recent:txs.slice().reverse().map(recentView) };
    }
    case 'staffRecent': return recentList(needStaff());
    case 'staffBootstrap': {
      const st = needStaff();
      if(st.role !== 'admin') return { staff:sView(st), recent:recentList(st) };
      return { staff:sView(st), recent:recentList(st), summary:summary(), redemptions:redemptionList(''), rewards:M.rewards.slice().sort(bySort).map(rwView),
        wasteTypes:M.wasteTypes.slice().sort(bySort).map(wtView), staffList:M.staff.map(sView), settings:adminSettings(), members:memberSearch('') };
    }

    /* ---------- แอดมิน ---------- */
    case 'adminSummary': needStaff(true); return summary();
    case 'adminRedemptions': needStaff(true); return redemptionList(String(p.status || ''));
    case 'adminUpdateRedemption': {
      const st = needStaff(true);
      if(!STATUS[p.status]) err('สถานะไม่ถูกต้อง');
      const note = String(p.note||'').trim();
      if(p.status === 'cancelled' && !note) err('กรุณาใส่เหตุผลในการยกเลิก');
      const red = M.redemptions.find(r => r.redeemId === p.redeemId); if(!red) err('ไม่พบคำขอแลกของ');
      if(red.status === 'cancelled') err('คำขอนี้ถูกยกเลิกและคืนแต้มไปแล้ว แก้ไขไม่ได้');
      const now = new Date().toISOString();
      if(p.status === 'cancelled'){
        const m = M.members.find(x => x.memberId === red.memberId); m.points = rp(m.points + red.points);
        const rw = M.rewards.find(x => x.rewardId === red.rewardId); if(rw && rw.stock !== '') rw.stock = Number(rw.stock) + 1;
        M.tx.push({ txId:'TX'+Date.now()+'C', memberId:m.memberId, type:'refund', wasteName:'คืนแต้ม: '+red.rewardName, quantity:'', unit:'', points:red.points, staffId:st.staffId, note:red.redeemId+' '+note, photo:'', createdAt:now });
      }
      Object.assign(red, { status:p.status, statusNote:note, updatedAt:now });
      return { list:redemptionList(String(p.filter || '')) };
    }
    case 'adminWasteTypes': needStaff(true); return M.wasteTypes.slice().sort(bySort).map(wtView);
    case 'adminSaveWasteType': {
      needStaff(true);
      const name = String(p.name||'').trim(); if(!name) err('กรุณาใส่ชื่อประเภทขยะ');
      const rate = Number(p.pointsPerUnit); if(!(rate >= 0) || rate > 100000) err('แต้มต่อหน่วยไม่ถูกต้อง');
      const sale = Number(p.salePrice); if(!(sale >= 0) || sale > 100000) err('ราคาขายต่อไม่ถูกต้อง');
      let t = p.wasteTypeId ? M.wasteTypes.find(x => x.wasteTypeId === p.wasteTypeId) : null;
      if(!t){ t = { wasteTypeId:nextId(M.wasteTypes.map(x=>x.wasteTypeId),'WT',2) }; M.wasteTypes.push(t); }
      Object.assign(t, { name, unit:String(p.unit||'').trim() || 'กก.', pointsPerUnit:rate, description:String(p.description||'').trim(), active:!!p.active, sort:Number(p.sort)||99, salePrice:sale });
      return Object.assign(wtView(t), { list:M.wasteTypes.slice().sort(bySort).map(wtView) });
    }
    case 'adminMembers': needStaff(true); return memberSearch(p.q);
    case 'adminResetPin': {
      needStaff(true); checkPin(String(p.pin||''));
      const m = M.members.find(x => x.memberId === normId(p.memberId)); if(!m) err('ไม่พบสมาชิก');
      m.pin = String(p.pin); m.pv++; return true;
    }
    case 'adminAdjustPoints': {
      const st = needStaff(true); const d = rp(Number(p.delta));
      if(!d) err('กรุณาใส่จำนวนแต้มที่ต้องการปรับ (เช่น 10 หรือ -10)');
      const note = String(p.note||'').trim(); if(!note) err('กรุณาใส่เหตุผลในการปรับแต้ม');
      const m = M.members.find(x => x.memberId === normId(p.memberId)); if(!m) err('ไม่พบสมาชิก');
      if(m.points + d < 0) err('แต้มคงเหลือจะติดลบ');
      m.points = rp(m.points + d);
      M.tx.push({ txId:'TX'+Date.now()+'A', memberId:m.memberId, type:'adjust', wasteName:'ปรับแต้มโดยเจ้าหน้าที่', quantity:'', unit:'', points:d, staffId:st.staffId, note, photo:'', createdAt:new Date().toISOString() });
      return { balance:m.points, member:aView(m) };
    }
    case 'adminRewards': needStaff(true); return M.rewards.slice().sort(bySort).map(rwView);
    case 'adminSaveReward': {
      needStaff(true);
      if(!String(p.name||'').trim()) err('กรุณาใส่ชื่อของรางวัล');
      if(!CAT[p.category]) err('กรุณาเลือกหมวดหมู่');
      const pts = rp(Number(p.points)); if(!(pts > 0)) err('แต้มที่ใช้แลกต้องมากกว่า 0');
      const cost = Number(p.cost); if(!(cost >= 0)) err('ต้นทุนไม่ถูกต้อง');
      const stock = String(p.stock ?? '').trim(); if(stock !== '' && !(Number(stock) >= 0)) err('จำนวนในสต็อกไม่ถูกต้อง');
      const imgs = (p.images||[]).concat(p.newPhotos||[]); if(imgs.length > 6) err('ใส่รูปได้สูงสุด 6 รูปต่อรายการ');
      let r = p.rewardId ? M.rewards.find(x => x.rewardId === p.rewardId) : null;
      if(!r){ r = { rewardId:nextId(M.rewards.map(x=>x.rewardId),'RW',2) }; M.rewards.push(r); }
      Object.assign(r, { name:p.name.trim(), category:p.category, points:pts, cost, description:String(p.description||'').trim(), imageUrls:imgs.join('\n'), stock:stock === '' ? '' : Math.round(Number(stock)), active:!!p.active, sort:Number(p.sort)||99, kind:p.kind === 'coupon' ? 'coupon' : 'item', sponsor:String(p.sponsor||'').trim() });
      return { saved:rwView(r), list:M.rewards.slice().sort(bySort).map(rwView) };
    }
    case 'adminStaff': needStaff(true); return M.staff.map(sView);
    case 'adminSaveStaff': {
      const me = needStaff(true); const u = String(p.username||'').trim().toLowerCase();
      if(!/^[a-z0-9_.]{3,30}$/.test(u)) err('ชื่อผู้ใช้ใช้ได้เฉพาะ a-z 0-9 _ . ยาว 3-30 ตัว');
      const pw = String(p.password || ''); if(pw && pw.length < 8) err('รหัสผ่านต้องยาวอย่างน้อย 8 ตัวอักษร');
      let s = p.staffId ? M.staff.find(x => x.staffId === p.staffId) : null;
      if(M.staff.some(x => x.username === u && x !== s)) err('ชื่อผู้ใช้นี้มีอยู่แล้ว');
      const role = p.role === 'admin' ? 'admin' : 'staff';
      if(s){ if(s === me && (!p.active || role !== 'admin')) err('ไม่สามารถปิดใช้งานหรือลดสิทธิ์บัญชีตัวเองได้'); }
      else { if(!pw) err('กรุณาตั้งรหัสผ่านให้บัญชีใหม่'); s = { staffId:nextId(M.staff.map(x=>x.staffId),'ST',2), pv:0 }; M.staff.push(s); }
      Object.assign(s, { username:u, displayName:String(p.displayName||'').trim() || u, role, active:!!p.active });
      if(pw){ s.password = pw; s.pv++; }
      const out = Object.assign(sView(s), { list:M.staff.map(sView) });
      if(pw && s === me) out.token = issue('staff', s.staffId, s.pv);   // เปลี่ยนรหัสผ่านตัวเอง: ได้บัตรผ่านใหม่
      return out;
    }
    case 'adminSettings': needStaff(true); return adminSettings();
    case 'adminSaveSettings': {
      needStaff(true);
      EDIT_KEYS.forEach(k => { if(k in p) M.settings[k] = k === 'requirePhoto' ? String(!!p[k]) : k === 'postMinPoints' ? String(Math.max(0, rp(Number(p[k]) || 0))) : String(p[k]).trim(); });
      return { settings:publicSettings(), admin:adminSettings() };
    }
    case 'adminUploadLogo': needStaff(true); M.settings.logoUrl = p.photo; return { logoUrl:p.photo };
    case 'adminSetImage': {
      needStaff(true);
      const key = p.kind === 'hero' ? 'heroImageUrl' : p.kind === 'logo' ? 'logoUrl' : '';
      if(!key) err('ประเภทรูปไม่ถูกต้อง');
      if(!p.remove && !/^data:image\/(jpeg|png|webp);base64,/.test(String(p.photo||''))) err('ไฟล์รูปไม่ถูกต้อง');
      M.settings[key] = p.remove ? '' : p.photo;
      return { url:M.settings[key], settings:publicSettings() };
    }
  }
  err('ไม่รู้จักคำสั่งนี้');
}

/* =========================================================
 *  เริ่มต้น: แสดงหน้าทันทีจากข้อมูลที่จำไว้ในเครื่อง (หรือค่าเริ่มต้น)
 *  แล้วขอข้อมูลล่าสุดเบื้องหลัง ไม่ต้องรอระบบหลังบ้านก่อนเห็นหน้าเว็บ
 * ========================================================= */
(function init(){
  if(DEMO) $('#demoBar').hidden = false;
  const cached = loadJSON(PUB_KEY);
  if(cached && cached.settings && ['wasteTypes','rewards','dropoffs'].every(k => Array.isArray(cached[k]))){ S.pub = cached; S.pubLoaded = true; }
  else { S.pub = DEFAULT_PUB(); S.pubLoaded = false; }
  route();
  refreshPublic().catch(()=>{});
  if(S.mtoken) setTimeout(() => loadQR().catch(()=>{}), 1200);   // เตรียมตัวสร้าง QR ของบัตรสมาชิกไว้ล่วงหน้า
})();
</script>
